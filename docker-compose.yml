version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# External data — set RAW_DATA_DIR in .env (or export in your shell):
#
#   echo "RAW_DATA_DIR=/media/my_drive/tiff_data" > .env
#
# Your TIFFs and SHPs stay on the external drive — nothing is copied.
# Processed tiles and outputs stay in this project folder.
# ─────────────────────────────────────────────────────────────────────────────

x-base: &base
  build: .
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - RAW_DATA_DIR=/raw_data
    - PROCESSED_DIR=data/processed
    - CHECKPOINT_DIR=checkpoints
    - OUTPUT_DIR=outputs
  volumes:
    - ${RAW_DATA_DIR:-./data/raw}:/raw_data:ro
    - ./data/processed:/app/data/processed
    - ./outputs:/app/outputs
    - ./checkpoints:/app/checkpoints
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:

  data_prep:
    <<: *base
    entrypoint: ["python", "src/00_data_prep.py"]
    command: ["--source", "/raw_data"]

  inspect:
    <<: *base
    entrypoint: ["python", "src/00_inspect.py"]

  preprocess:
    <<: *base
    entrypoint: ["python", "src/01_preprocess.py"]

  train:
    <<: *base
    entrypoint: ["python", "src/03_train.py"]
    shm_size: "4gb"

  infer:
    <<: *base
    entrypoint: ["python", "src/04_inference.py"]

  shell:
    <<: *base
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
