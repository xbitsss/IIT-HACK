version: "3.9"

x-base: &base
  build: .
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - RAW_DATA_DIR=/raw_data
    - SHP_DIR=/raw_data/CG_SHP
    - PROCESSED_DIR=data/processed
    - CHECKPOINT_DIR=checkpoints
    - OUTPUT_DIR=outputs
  volumes:
    - ${RAW_DATA_DIR:-./data/raw}:/raw_data:ro
    - ./data/processed:/app/data/processed
    - ./outputs:/app/outputs
    - ./checkpoints:/app/checkpoints

services:

  inspect:
    <<: *base
    entrypoint: ["python", "src/00_inspect.py"]

  # Preprocess a specific folder:
  # docker compose run --rm -e RAW_DATA_DIR=/raw_data/CG_1 preprocess
  preprocess:
    <<: *base
    entrypoint: ["python", "src/01_preprocess.py"]

  visualize:
    <<: *base
    entrypoint: ["python", "src/05_visualize.py"]

  # Fresh training (first folder):
  # docker compose run --rm train
  #
  # Incremental training (subsequent folders):
  # docker compose run --rm train --resume
  train:
    <<: *base
    entrypoint: ["python", "src/03_train.py"]
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Run full incremental pipeline automatically:
  # docker compose run --rm train-all
  train-all:
    <<: *base
    entrypoint: ["bash", "src/06_train_incremental.sh"]
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  infer:
    <<: *base
    entrypoint: ["python", "src/04_inference.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  shell:
    <<: *base
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true