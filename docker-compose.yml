version: "3.9"

x-base: &base
  build: .
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
    - RAW_DATA_DIR=/raw_data
    # SHP_DIR is set per-shard by 06_train_incremental.sh via auto-detection.
    # This default is only used when running preprocess/inspect standalone.
    - SHP_DIR=/raw_data/SHP
    - PROCESSED_DIR=data/processed
    - CHECKPOINT_DIR=checkpoints
    - OUTPUT_DIR=outputs
    - HF_TOKEN=${HF_TOKEN}
    - REPLAY_DIR=data/replay
  volumes:
    # ── Raw data (read-only) ─────────────────────────────────────────────────
    # Set RAW_DATA_DIR in .env on your host, e.g.:
    #   RAW_DATA_DIR=C:/Users/name/Documents/QGIS_DATASETS/ALL
    # Inside the container it is always mounted at /raw_data.
    - ${RAW_DATA_DIR:-./data/raw}:/raw_data:ro

    # ── Pipeline-generated data (read-write) ─────────────────────────────────
    - ./data/processed:/app/data/processed
    - ./data/replay:/app/data/relay
    - ./outputs:/app/outputs
    - ./checkpoints:/app/checkpoints

    # ── Source code (mounted so edits are reflected without a rebuild) ───────
    # Mount the entire src/ directory — changes to any .py file are live.
    - ./src:/app/src

    # ── Specialist code ───────────────────────────────────────────────────────
    - ./specialist:/app/specialist


services:

  # ── Utilities ──────────────────────────────────────────────────────────────

  inspect:
    <<: *base
    entrypoint: ["python", "src/00_inspect.py"]

  preprocess:
    <<: *base
    entrypoint: ["python", "src/01_preprocess.py"]

  visualize:
    <<: *base
    entrypoint: ["python", "src/05_visualize.py"]

  notify-test:
    <<: *base
    entrypoint: ["python", "src/07_notify.py", "--test"]

  # ── Single-shard training (no replay, no specialist) ──────────────────────
  train:
    <<: *base
    entrypoint: ["python", "src/03_train.py"]
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Full incremental pipeline: shard 1 → shard 2 → specialist ─────────────
  #
  #   docker compose run --rm train-all --data-dir /raw_data/ALL
  #   docker compose run --rm train-all --data-dir /raw_data/ALL --from 2
  #   docker compose run --rm train-all --data-dir /raw_data/ALL --message "NIR test"
  #   docker compose run --rm train-all --data-dir /raw_data/ALL --skip-specialist
  #   docker compose run --rm train-all --data-dir /raw_data/ALL --pretrained /raw_data/model.pth
  train-all:
    <<: *base
    entrypoint: ["bash", "src/06_train_incremental.sh"]
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Specialist only ────────────────────────────────────────────────────────
  #
  # If tiles exist (data/processed/ or data/replay/):
  #   docker compose run --rm specialist
  #   docker compose run --rm specialist --message "Lowering railway threshold"
  #
  # If NO tiles exist yet (bootstraps preprocessing from raw data):
  #   docker compose run --rm specialist --data-dir /raw_data/ALL
  #
  # Warm-start from generalist weights:
  #   docker compose run --rm shell
  #   python specialist/03_train_specialist.py --init-weights checkpoints/best_model.pt
  specialist:
    <<: *base
    entrypoint: ["bash", "src/06_train_incremental.sh", "--specialist-only"]
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Generalist inference (4-class mask) ────────────────────────────────────
  #
  #   docker compose run --rm infer \
  #       --input /raw_data/image.tif --output /app/outputs/mask.tif
  #   docker compose run --rm infer \
  #       --input /raw_data/image.tif --output /app/outputs/mask.tif --no-tta
  infer:
    <<: *base
    entrypoint: ["python", "src/04_inference.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Combined inference: generalist + specialist overlay (7-class) ──────────
  #
  # Specialist overwrites Bridge/Railway/Utility pixels where its confidence
  # exceeds the per-class threshold in config_specialist.py.
  #
  #   docker compose run --rm combined-infer \
  #       --input /raw_data/image.tif --output /app/outputs/combined_mask.tif
  #   docker compose run --rm combined-infer \
  #       --input /raw_data/image.tif --output /app/outputs/mask.tif --visualize
  combined-infer:
    <<: *base
    entrypoint: ["python", "specialist/04_inference_combined.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Interactive shell ──────────────────────────────────────────────────────
  shell:
    <<: *base
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true